# Levanta la API y Postgres: JWT_SECRET=$(openssl rand -base64 48) docker compose up
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 3s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://auth:auth@db:5432/auth
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos:
